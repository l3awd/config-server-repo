server.port=9004

#Eureka Configuration
eureka.client.serviceUrl.defaultZone=http://localhost:9102/eureka/
eureka.client.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

#Spring Cloud Gateway routes
spring.cloud.gateway.routes[0].id=microservice-produits
spring.cloud.gateway.routes[0].uri=lb://microservice-produits
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/produits/**
spring.cloud.gateway.routes[0].filters[0]=RewritePath=/api/produits/(?<path>.*), /${path}

spring.cloud.gateway.routes[1].id=microservice-commandes
spring.cloud.gateway.routes[1].uri=lb://microservice-commandes
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/commandes/**
spring.cloud.gateway.routes[1].filters[0]=RewritePath=/api/commandes/(?<path>.*), /${path}

spring.cloud.gateway.routes[2].id=microservice-paiement
spring.cloud.gateway.routes[2].uri=lb://microservice-paiement
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/paiement/**
spring.cloud.gateway.routes[2].filters[0]=RewritePath=/api/paiement/(?<path>.*), /${path}

spring.cloud.gateway.routes[3].id=ms-client
spring.cloud.gateway.routes[3].uri=lb://ms-client
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/client/**
spring.cloud.gateway.routes[3].filters[0]=RewritePath=/api/client/(?<path>.*), /${path}

management.endpoints.web.exposure.include=*